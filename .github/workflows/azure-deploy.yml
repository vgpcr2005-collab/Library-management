name: Build and deploy protected library website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Test package
        run: mvn --batch-mode clean verify

      - name: Sign in to Azure with workload identity
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container
        env:
          REGISTRY: ${{ vars.AZURE_ACR_LOGIN_SERVER }}
          ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          az acr login --name "$ACR_NAME"
          docker build -f deployment/azure/Dockerfile -t "$REGISTRY/smart-library:$IMAGE_TAG" .
          docker push "$REGISTRY/smart-library:$IMAGE_TAG"

      - name: Deploy image to App Service
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
          ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
          REGISTRY: ${{ vars.AZURE_ACR_LOGIN_SERVER }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          az webapp config container set \
            --resource-group "$RESOURCE_GROUP" \
            --name "$WEBAPP_NAME" \
            --docker-custom-image-name "$REGISTRY/smart-library:$IMAGE_TAG" \
            --docker-registry-server-url "https://$REGISTRY"
          az webapp config set \
            --resource-group "$RESOURCE_GROUP" \
            --name "$WEBAPP_NAME" \
            --generic-configurations '{"acrUseManagedIdentityCreds":true}'
          az webapp restart --resource-group "$RESOURCE_GROUP" --name "$WEBAPP_NAME"
