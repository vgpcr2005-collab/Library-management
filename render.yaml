services:
  - type: web
    name: alliance-smart-library
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: APP_ENV
        value: production
      - key: LIBRARY_DB_URL
        sync: false
      - key: LIBRARY_DB_USER
        sync: false
      - key: LIBRARY_DB_PASSWORD
        sync: false
